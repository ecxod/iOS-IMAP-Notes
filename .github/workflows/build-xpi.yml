name: Build XPI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript
        run: npm run check

      - name: Test Apple Notes MIME handling
        run: npm test

      - name: Build standard and Header Controls XPIs
        run: npm run build:xpi:all

      - name: Read extension version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify XPI variants
        run: |
          standard="dist/thunderbird-ios-imap-notes-${{ steps.version.outputs.version }}.xpi"
          header_controls="dist/thunderbird-ios-imap-notes-${{ steps.version.outputs.version }}-header-controls.xpi"
          unzip -t "$standard"
          unzip -t "$header_controls"
          test "$(unzip -p "$standard" manifest.json | jq 'has("experiment_apis")')" = false
          test "$(unzip -p "$header_controls" manifest.json | jq 'has("experiment_apis")')" = true
          test "$(unzip -p "$standard" manifest.json | jq '.browser_specific_settings.gecko | has("update_url")')" = false
          test "$(unzip -p "$header_controls" manifest.json | jq -r '.browser_specific_settings.gecko.update_url')" = "https://raw.githubusercontent.com/ecxod/iOS-IMAP-Notes/master/updates/header-controls.json"
          ! unzip -Z1 "$standard" | grep -Eq '^images/(check\.png|spinner\.gif)$'
          expected_hash=$(jq -r '.addons["iOSNotes@siliconvenice.net"].updates[-1].update_hash' updates/header-controls.json)
          actual_hash="sha256:$(sha256sum "$header_controls" | cut -d ' ' -f 1)"
          test "$expected_hash" = "$actual_hash"
          ! unzip -Z1 "$standard" | grep -q '^experiments/'
          unzip -Z1 "$header_controls" | grep -q '^experiments/notesHeader/implementation.js$'
          ! unzip -p "$standard" scripts/header-controls.mjs | grep -q 'browser.notesHeader'
          unzip -p "$header_controls" scripts/header-controls.mjs | grep -q 'browser.notesHeader'

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-ios-imap-notes-xpi
          path: dist/thunderbird-ios-imap-notes-*.xpi
          if-no-files-found: error
          retention-days: 30

      - name: Attach XPI to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/thunderbird-ios-imap-notes-*.xpi
          generate_release_notes: true
