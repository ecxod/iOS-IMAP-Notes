name: Build XPI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript
        run: npm run check

      - name: Test Apple Notes MIME handling
        run: npm test

      - name: Build XPI
        run: npm run build:xpi

      - name: Read extension version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify XPI
        run: unzip -t "dist/thunderbird-ios-imap-notes-${{ steps.version.outputs.version }}.xpi"

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-ios-imap-notes-xpi
          path: dist/thunderbird-ios-imap-notes-*.xpi
          if-no-files-found: error
          retention-days: 30

      - name: Attach XPI to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/thunderbird-ios-imap-notes-*.xpi
          generate_release_notes: true
