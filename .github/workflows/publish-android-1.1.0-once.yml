name: Replace Android release APK with 1.1.0 once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-android-1.1.0-once.yml
      - .release-upload/ios-imap-notes-android-1.1.0.apk

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and signed APK
        uses: actions/checkout@v4

      - name: Verify signed APK checksum
        run: |
          echo "b7985350ac7efc93ec7c5a307ff618b5df4705a3d93e8928f79f354317d668cc  .release-upload/ios-imap-notes-android-1.1.0.apk" | sha256sum -c -

      - name: Upload 1.1.0 and remove 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.4.0 .release-upload/ios-imap-notes-android-1.1.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release delete-asset v1.4.0 ios-imap-notes-android-1.0.0.apk --yes --repo "$GITHUB_REPOSITORY"
